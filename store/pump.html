<!doctype html>
<meta charset="utf-8">
<title>store asset pump</title>
<script>
// Hands the store screenshots to the opener/parent window as ArrayBuffers.
// Same-origin fetch here, postMessage out — used once to upload the App Store screenshots.
const NAMES = ['01-t01','02-t08','03-t20','04-t30','05-t27','06-t39','07-t33','08-t36'];
(async () => {
  for (const n of NAMES) {
    const buf = await fetch(n + '.jpg').then(r => r.arrayBuffer());
    parent.postMessage({ kind: 'shot', name: n + '.jpg', buf }, '*', [buf]);
  }
  parent.postMessage({ kind: 'done', count: NAMES.length }, '*');
})();
</script>
